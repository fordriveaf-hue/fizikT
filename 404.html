<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
const path = window.location.pathname.replace(/^\/+|\/+$/g, "");

if (path === "" || path === "index") {
  window.location.href = "/index.html";
} else {
  window.location.href = "/" + path + ".html";
}
</script>
</head>

</html>
