<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>جزوه‌های فیزیک تابستان</title>
<style>
body { font-family: Vazirmatn; background:#eef2ff; padding:20px; }
.box { max-width:700px; margin:auto; background:white; padding:20px; border-radius:14px; }
.file-item { background:#f3f6ff; padding:12px; border-radius:10px; margin:10px 0;
display:flex; justify-content:space-between; }
a.btn { text-decoration:none; background:#007bff; color:white; padding:6px 12px; border-radius:6px; }
</style>
</head>

<body>
<div class="box">
  <h2>📘 جزوه‌های فیزیک تابستان</h2>
  <div id="fileList">در حال بارگذاری...</div>

  <hr>
  <a class="btn" href="/upload">آپلود فایل</a>
  <a class="btn" href="/help">راهنما</a>
</div>

<script>
const owner = "fordriveaf-hue";
const repo  = "upload";

async function loadFiles() {
  const list = document.getElementById("fileList");
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents`);
  const files = await res.json();
  list.innerHTML = "";

  files.forEach(f => {
    list.innerHTML += `
      <div class="file-item">
        <span>${f.name}</span>
        <a class="btn" href="${f.download_url}" download>دانلود</a>
      </div>
    `;
  });
}
loadFiles();
</script>
</body>
</html>
